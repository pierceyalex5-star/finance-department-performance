<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Work</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#171a20;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--blue:#1d4ed8;--red:#b91c1c;--amber:#a16207;--shadow:0 12px 38px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,textarea{font:inherit}.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;max-width:1450px;margin:auto;padding:18px;min-height:100vh}.chat,.side{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.chat{display:flex;flex-direction:column;min-height:calc(100vh - 36px);overflow:hidden}.head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h1{font-size:19px;margin:0}.head p{font-size:12px;color:var(--muted);margin:4px 0 0}.logout{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;color:var(--muted)}.msgs{padding:22px;overflow:auto;flex:1;background:linear-gradient(#fff,#fcfcfd)}.msg{display:flex;margin-bottom:14px}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.46;font-size:14px}.user .bubble{background:#111827;color:#fff;border-bottom-right-radius:5px}.assistant .bubble{background:#f3f4f6;border-bottom-left-radius:5px}.composer{border-top:1px solid var(--line);padding:14px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px}textarea{min-height:72px;max-height:150px;resize:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafafa;outline:none}textarea:focus{background:#fff;border-color:#9ca3af}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer}.primary{background:#111827;color:#fff;border-color:#111827}.mic{font-size:20px;width:46px}.mic.on{border-color:#fca5a5;outline:3px solid #fee2e2}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;color:#4b5563;font-size:11px;cursor:pointer}.side{padding:16px;overflow:auto;max-height:calc(100vh - 36px)}h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 10px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{border:1px solid var(--line);border-radius:14px;padding:12px}.metric .v{font-size:25px;font-weight:750}.metric .l{font-size:11px;color:var(--muted)}.section{margin-top:18px}.task{border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px}.task .top{display:flex;gap:8px;align-items:start}.task input{width:17px;height:17px;margin-top:2px}.title{font-weight:650;font-size:13px}.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.tag{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:2px 6px;color:var(--muted)}.tag.red{color:var(--red);border-color:#fecaca}.tag.blue{color:var(--blue);border-color:#bfdbfe}.tag.amber{color:var(--amber);border-color:#fde68a}.project{border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:7px}.project b{font-size:13px}.project div{font-size:11px;color:var(--muted);margin-top:3px}.note{padding:9px 0;border-top:1px solid var(--line);font-size:12px}.note:first-child{border-top:0}.note b{display:block}.note span{color:var(--muted);font-size:11px}.typing{color:var(--muted);font-size:12px;padding:4px 0 10px;display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{max-height:none}.chat{min-height:75vh}.bubble{max-width:90%}}</style></head><body><div class="app"><section class="chat"><div class="head"><div><h1>My Work</h1><p>Talk normally. I’ll organize the work.</p></div><button class="logout" id="logout">Log out</button></div><div class="msgs" id="msgs"></div><div class="composer"><div class="typing" id="typing">Thinking and updating your workspace…</div><div class="row"><textarea id="box" placeholder="Tell me what’s on your mind…"></textarea><button class="btn mic" id="mic">🎤</button><button class="btn primary" id="send">Send</button></div><div class="quick"><button data-q="What should I focus on today?">What should I focus on?</button><button data-q="What am I waiting on?">Waiting on?</button><button data-q="What is overdue?">Overdue?</button><button data-q="What did we decide recently?">Recent decisions</button><button data-q="Show me my current projects and next actions.">Projects</button></div></div></section><aside class="side"><h3>Right now</h3><div class="metrics"><div class="metric"><div class="v" id="today">0</div><div class="l">Due today</div></div><div class="metric"><div class="v" id="overdue">0</div><div class="l">Overdue</div></div><div class="metric"><div class="v" id="waiting">0</div><div class="l">Waiting</div></div><div class="metric"><div class="v" id="projectsN">0</div><div class="l">Projects</div></div></div><div class="section"><h3>Priority work</h3><div id="tasks"></div></div><div class="section"><h3>Projects</h3><div id="projects"></div></div><div class="section"><h3>Recent notes & decisions</h3><div id="notes"></div></div></aside></div><script>
const $=id=>document.getElementById(id),esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let st=null;
function fmt(d){if(!d)return'No date';return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function render(){if(!st)return;today.textContent=st.metrics.today;overdue.textContent=st.metrics.overdue;waiting.textContent=st.metrics.waiting;projectsN.textContent=st.metrics.projects;msgs.innerHTML=st.messages.map(m=>`<div class="msg ${m.role}"><div class="bubble">${esc(m.content)}</div></div>`).join('');msgs.scrollTop=msgs.scrollHeight;const open=st.tasks.filter(t=>!['done','cancelled'].includes(t.status));tasks.innerHTML=open.slice(0,8).map(t=>`<div class="task"><div class="top"><input type="checkbox" onchange="done('${t.id}')"><div><div class="title">${esc(t.title)}</div><div class="meta">${t.project_name?`<span class="tag blue">${esc(t.project_name)}</span>`:''}${t.due_at?`<span class="tag ${new Date(t.due_at)<new Date()?'red':''}">${fmt(t.due_at)}</span>`:''}${t.status==='waiting'?`<span class="tag amber">Waiting${t.waiting_on?' · '+esc(t.waiting_on):''}</span>`:''}</div></div></div></div>`).join('')||'<div class="note">Nothing open.</div>';projects.innerHTML=st.projects.slice(0,10).map(p=>`<div class="project"><b>${esc(p.name)}</b><div>${p.open_tasks} open task${p.open_tasks===1?'':'s'}</div></div>`).join('')||'<div class="note">No projects yet.</div>';notes.innerHTML=st.notes.slice(0,7).map(n=>`<div class="note"><b>${esc(n.title||n.body)}</b><span>${esc(n.kind)}${n.project_name?' · '+esc(n.project_name):''}</span></div>`).join('')||'<div class="note">No notes yet.</div>'}
async function load(){const r=await fetch('/api/state');if(r.status===401){location.href='/login.html';return}st=await r.json();render()}
async function ask(text){text=(text||'').trim();if(!text)return;box.value='';if(!st)await load();st.messages.push({role:'user',content:text});render();typing.style.display='block';send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Request failed');await load()}catch(e){st.messages.push({role:'assistant',content:'Error: '+e.message});render()}finally{typing.style.display='none';send.disabled=false;box.focus()}}
send.onclick=()=>ask(box.value);box.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(box.value)}};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));window.done=async id=>{await fetch(`/api/tasks/${id}/complete`,{method:'POST'});await load()};logout.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login.html'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='en-CA';r.onresult=e=>box.value+=(box.value?' ':'')+e.results[0][0].transcript;r.onend=()=>{mic.classList.remove('on');mic.textContent='🎤'};mic.onclick=()=>{mic.classList.add('on');mic.textContent='●';r.start()}}else mic.onclick=()=>alert('Use your device dictation in this browser.');load();
</script></body></html>
