<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Fastener Industry Intelligence</title>
  <link rel="stylesheet" href="styles.css?v=20260815.1" />
  <link rel="stylesheet" href="enhanced.css?v=20260815.2" />
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-mark">FI</div>
      <div><strong>FASTENER INDUSTRY INTELLIGENCE</strong><span>North America intelligence command center</span></div>
    </div>
    <div class="market-strip" id="marketStrip"></div>
    <div class="header-actions">
      <button class="btn ghost" id="sourceRegisterBtn">Sources & Data</button>
      <button class="btn ghost" id="exportSourcesBtn">Export Sources</button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav id="sideNav"></nav>
      <div class="sidebar-foot"><div class="coverage-key"><strong>Evidence</strong><span class="evidence fact">FACT</span><span class="evidence mgmt">MGMT</span><span class="evidence est">EST</span><span class="evidence derived">DERIVED</span><span class="evidence inference">INFERENCE</span></div></div>
    </aside>
    <main class="main">
      <section class="controlbar">
        <div class="view-title"><h1 id="viewTitle">Industry Pulse</h1><span id="viewSubtitle">Decision-useful industry conditions and source-backed signals</span></div>
        <div class="filters">
          <label><input type="checkbox" class="evidenceFilter" value="fact" checked> Facts</label>
          <label><input type="checkbox" class="evidenceFilter" value="mgmt" checked> Management</label>
          <label><input type="checkbox" class="evidenceFilter" value="est" checked> Estimates</label>
          <label><input type="checkbox" class="evidenceFilter" value="derived" checked> Derived</label>
          <label><input type="checkbox" class="evidenceFilter" value="inference" checked> Inferences</label>
        </div>
      </section>
      <div id="app"></div>
    </main>
  </div>
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head"><div><span class="eyebrow" id="drawerType"></span><h2 id="drawerTitle"></h2><p id="drawerSubtitle"></p></div><button class="icon-btn" id="drawerClose" aria-label="Close">×</button></div>
    <div class="drawer-tabs" id="drawerTabs"></div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
  <div class="backdrop" id="backdrop"></div>
  <div class="modal" id="sourceModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head"><div><span class="eyebrow">Evidence & provenance</span><h2 id="sourceModalTitle">Source register</h2></div><button class="icon-btn" id="sourceModalClose">×</button></div>
      <div class="source-toolbar"><input id="sourceSearch" placeholder="Search sources, entities, periods, IDs..." /><select id="sourceTypeFilter"><option value="all">All evidence classes</option><option value="fact">Fact</option><option value="mgmt">Management commentary</option><option value="est">Estimate</option><option value="derived">Derived</option><option value="inference">Inference</option></select></div>
      <div id="sourceModalBody"></div>
    </div>
  </div>
  <script src="data.js?v=20260815.1"></script>
  <script src="app.js?v=20260815.1"></script>
  <script src="enhanced.js?v=20260815.2"></script>
</body>
</html>
