name: Patch SOP import UX

on:
  push:
    branches: [main]
    paths:
      - 'patch_sop_upload.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python patch_sop_upload.py
      - name: Validate
        run: |
          grep -q 'sop-upload.js' index.html
          grep -q "sopButton(h.sopUrl,'deliverable',h.id)" index.html
          grep -q "sopButton(t.sopUrl,'task',t.id)" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Import SOP and Open SOP workflow"
          git push
