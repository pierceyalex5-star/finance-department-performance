name: Apply Finance Control Tower governance v2

on:
  push:
    branches: [main]
    paths:
      - 'apply_governance_v2.py'
      - '.github/workflows/apply-governance-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply dashboard and Worker patch
        run: python apply_governance_v2.py
      - name: Validate JavaScript
        run: node --check cloudflare-worker/src/index.js
      - name: Install Neon dependency
        run: npm install @neondatabase/serverless
      - name: Seed migrated state into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import { neon } from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL);
          const state=JSON.parse(fs.readFileSync('state.json','utf8'));
          await sql`UPDATE dashboard_state SET state=${JSON.stringify(state)}::jsonb, updated_at=now() WHERE id=1`;
          console.log('Neon seeded to version',state.version);
          NODE
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html state.json cloudflare-worker/src/index.js
          git diff --cached --quiet || git commit -m 'Add effective periods dependencies materiality and SOP governance'
          git push
