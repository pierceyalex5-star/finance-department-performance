# Finance Control Tower - fast GitHub Pages deployment
name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'config.js'
      - 'auto-sync.js'
      - 'sop-upload.js'
      - 'sops/**'
      - 'state.json'
      - 'journal-analytics-seed.json'
      - 'd365-control-tower/**'
      - 'fastener-intelligence/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate Fastener JavaScript
        run: |
          node --check fastener-intelligence/enhanced.js
          node --check fastener-intelligence/trend-lab-v2.js
          node --check fastener-intelligence/trend-lab-v3.js
          node --check fastener-intelligence/trend-lag-v4.js
          node --check fastener-intelligence/intelligence-v3.js
          node --check fastener-intelligence/intelligence-v4.js
          node --check fastener-intelligence/intelligence-v5.js
          node --check fastener-intelligence/intelligence-v6.js
          node --check fastener-intelligence/intelligence-v13.js
          node --check fastener-intelligence/intelligence-v14.js
          node --check fastener-intelligence/intelligence-v15.js
          node --check fastener-intelligence/intelligence-v16.js
          node --check fastener-intelligence/intelligence-v17.js
          node --check fastener-intelligence/intelligence-v18.js
          node --check fastener-intelligence/intelligence-v19.js
          node --check fastener-intelligence/intelligence-v23.js
          node --check fastener-intelligence/intelligence-v24.js
          node --check fastener-intelligence/runtime-fix.js
          node --check fastener-intelligence/trend-data.js
          node --check fastener-intelligence/import-origin-data.js
      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html manifest.json sw.js config.js auto-sync.js sop-upload.js state.json journal-analytics-seed.json _site/
          if [ -d sops ]; then cp -R sops _site/; fi
          if [ -d d365-control-tower ]; then cp -R d365-control-tower _site/; fi
          if [ -d fastener-intelligence ]; then
            cp -R fastener-intelligence _site/
            curl -fsSL 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson' -o _site/fastener-intelligence/ne-countries.geojson
            python3 fastener-intelligence/build_geo_svgs.py _site/fastener-intelligence/ne-countries.geojson _site/fastener-intelligence/world-map.svg _site/fastener-intelligence/north-america-map.svg
            test -s _site/fastener-intelligence/world-map.svg
            test -s _site/fastener-intelligence/north-america-map.svg
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
