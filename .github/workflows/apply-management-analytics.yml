name: Apply Management Analytics Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/add-management-analytics.py'
      - '.github/workflows/apply-management-analytics.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply management analytics changes
        run: python scripts/add-management-analytics.py
      - name: Validate inline JavaScript
        run: node --check /tmp/dashboard-inline.js
      - name: Commit generated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cloudflare-worker/src/index.js
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add workload bottleneck score and post-mortem analytics"
            git push
          fi
