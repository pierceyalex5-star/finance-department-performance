name: Fix Manager KPI Team Label

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-manager-kpi-label.py'
      - '.github/workflows/fix-manager-kpi-label.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-manager-kpi-label.py
      - name: Commit generated app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Fix manager KPI team member label"
            git push
          fi
