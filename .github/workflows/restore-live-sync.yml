name: Restore Finance Control Tower live sync

on:
  push:
    branches: [main]
    paths:
      - 'patch_live_sync.py'
      - 'seed_neon_from_state.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch front end and Worker
        run: python patch_live_sync.py
      - name: Install Neon dependency
        run: npm install @neondatabase/serverless
      - name: Seed Neon from current GitHub state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node seed_neon_from_state.mjs
      - name: Commit live-sync configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js auto-sync.js cloudflare-worker/src/index.js
          git diff --cached --quiet || git commit -m "Restore live shared-state sync without notifications"
          git push
