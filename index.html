<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>D365 Transformation Control Tower</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <div class="brand-mark">D365</div>
      <h1>D365 Transformation Control Tower</h1>
      <p>Enter the team access key to open the project workspace.</p>
      <input id="accessKeyInput" type="password" autocomplete="current-password" placeholder="Team access key" />
      <button id="accessBtn" class="btn primary">Open workspace</button>
      <div id="authError" class="error-text"></div>
      <small>Project data is stored server-side and is not embedded in the public application code.</small>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">D365</div>
        <div><strong>D365 PROGRAM</strong><span>Transformation Control Tower</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <label>Working as</label>
        <input id="actorInput" value="Team member" />
        <div class="sync-row"><span id="syncDot" class="sync-dot"></span><span id="syncText">Connecting…</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div id="breadcrumb" class="breadcrumb">D365 / Cockpit</div>
          <h1 id="pageTitle">Executive Cockpit</h1>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="btn ghost">Refresh</button>
          <button id="lockBtn" class="btn ghost">Lock</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn">×</button></div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFoot" class="modal-foot"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
