# Finance Control Tower - GitHub Pages deployment
name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'config.js'
      - 'auto-sync.js'
      - 'sop-upload.js'
      - 'sops/**'
      - 'state.json'
      - 'journal-analytics-seed.json'
      - 'd365-control-tower/**'
      - 'fastener-intelligence/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    # Refresh source-backed Fastener Trend Lab data every morning (10:40 UTC = 06:40 EDT).
    - cron: '40 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js config.js auto-sync.js sop-upload.js state.json journal-analytics-seed.json _site/
          if [ -d sops ]; then cp -R sops _site/; fi
          if [ -d d365-control-tower ]; then cp -R d365-control-tower _site/; fi
          if [ -d fastener-intelligence ]; then
            cp -R fastener-intelligence _site/
            echo 'Refreshing Fastener Trend Lab public data...'
            python3 fastener-intelligence/build_trend_data.py _site/fastener-intelligence/trend-data.js || echo 'Trend data refresh failed; using committed fallback.'
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
