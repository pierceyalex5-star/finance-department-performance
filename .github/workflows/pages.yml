# Finance Control Tower - GitHub Pages deployment
name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'config.js'
      - 'auto-sync.js'
      - 'sop-upload.js'
      - 'sops/**'
      - 'state.json'
      - 'journal-analytics-seed.json'
      - 'd365-control-tower/**'
      - 'fastener-intelligence/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install Fastener data dependencies
        run: python3 -m pip install --quiet openpyxl
      - name: Validate Fastener JavaScript
        run: |
          node --check fastener-intelligence/enhanced.js
          node --check fastener-intelligence/trend-lab-v2.js
          node --check fastener-intelligence/trend-lab-v3.js
          node --check fastener-intelligence/intelligence-v3.js
          node --check fastener-intelligence/intelligence-v4.js
          node --check fastener-intelligence/intelligence-v5.js
          node --check fastener-intelligence/intelligence-v6.js
          node --check fastener-intelligence/intelligence-v7.js
          node --check fastener-intelligence/intelligence-v8.js
          node --check fastener-intelligence/intelligence-v9.js
          node --check fastener-intelligence/intelligence-v10.js
          node --check fastener-intelligence/intelligence-v11.js
          node --check fastener-intelligence/intelligence-v13.js
          node --check fastener-intelligence/intelligence-v14.js
          node --check fastener-intelligence/intelligence-v15.js
          node --check fastener-intelligence/intelligence-v16.js
          node --check fastener-intelligence/runtime-fix.js
      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js config.js auto-sync.js sop-upload.js state.json journal-analytics-seed.json _site/
          if [ -d sops ]; then cp -R sops _site/; fi
          if [ -d d365-control-tower ]; then cp -R d365-control-tower _site/; fi
          if [ -d fastener-intelligence ]; then
            cp -R fastener-intelligence _site/
            echo 'Refreshing Fastener Trend Lab public data...'
            python3 fastener-intelligence/build_trend_data.py _site/fastener-intelligence/trend-data.js || echo 'Base trend data refresh failed; using committed fallback.'
            python3 fastener-intelligence/extend_trend_history.py _site/fastener-intelligence/trend-data.js || echo 'History extension failed; retaining base history.'
            python3 fastener-intelligence/augment_energir_data.py _site/fastener-intelligence/trend-data.js || echo 'Energir trend augmentation failed; retaining base trend data.'
            echo 'Refreshing and validating Drewry freight history...'
            python3 fastener-intelligence/augment_drewry_data.py _site/fastener-intelligence/trend-data.js
            echo 'Refreshing and validating official U.S. HS 7318 import origin mix...'
            python3 fastener-intelligence/augment_us_import_origins.py _site/fastener-intelligence/import-origin-data.js
            echo 'Loading Natural Earth country boundaries for self-contained maps...'
            curl -fsSL 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson' -o _site/fastener-intelligence/ne-countries.geojson
            python3 -c "import json; p='_site/fastener-intelligence/ne-countries.geojson'; g=json.load(open(p,encoding='utf-8')); n=len(g.get('features',[])); assert n>=150, f'Natural Earth geometry incomplete: {n} features'; print(f'Natural Earth country geometry validated: {n} features')"
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
