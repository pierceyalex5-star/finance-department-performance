name: Verify Teams Push Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-teams-push.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Teams connection and send reversible handoff test
        shell: python
        run: |
          import json, urllib.request, datetime

          BASE = 'https://finance-performance-api.pierceyalex5.workers.dev'

          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=30) as r:
                  return json.loads(r.read().decode())

          def post(action):
              data = json.dumps(action).encode()
              req = urllib.request.Request(BASE + '/api/action', data=data, headers={'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          integrations = get('/api/integrations')
          if not integrations.get('teamsPushConfigured'):
              raise SystemExit('Teams push endpoint is not configured on the Worker')
          print('Teams push endpoint is connected.')

          state = get('/api/state')
          period = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m')
          emails = (state.get('settings') or {}).get('teamsEmails') or {}

          # Prefer an untouched deliverable so the test can be cleanly undone.
          candidate = None
          for h in state.get('headOfficeTemplate') or []:
              if h.get('active') is False:
                  continue
              reviewer = h.get('reviewedBy') or h.get('signoffOwner') or ''
              ds = (((state.get('deliverableStates') or {}).get(period) or {}).get(h.get('id')) or {})
              if reviewer and emails.get(reviewer) and not ds.get('preparedAt') and not ds.get('reviewedAt'):
                  candidate = ('deliverable', h, reviewer)
                  break

          if candidate:
              _, h, reviewer = candidate
              post({'type':'ho_stage_complete','period':period,'id':h['id'],'stage':'Preparation','doneBy':'Teams integration test'})
              post({'type':'ho_stage_undo','period':period,'id':h['id'],'stage':'Preparation'})
              print(f"Test handoff sent to configured Teams recipient: {reviewer}")
              print(f"Test item: {h.get('activity','Deliverable')}")
              print('Dashboard action was undone immediately after the push.')
          else:
              # Fall back to an untouched task whose next stage has a configured Teams recipient.
              stages_order = ['Preparation','Approval','Entry','Review']
              for t in state.get('taskTemplates') or []:
                  if t.get('active') is False:
                      continue
                  enabled = [s for s in stages_order if (t.get('stageEnabled') or {}).get(s) is not False]
                  if len(enabled) < 2:
                      continue
                  ps = (((state.get('periodStates') or {}).get(period) or {}).get(t.get('id')) or {}).get('stages') or {}
                  if ps:
                      continue
                  first, second = enabled[0], enabled[1]
                  next_owner = (t.get('stageOwners') or {}).get(second) or ''
                  if next_owner and emails.get(next_owner) and next_owner != 'Unassigned':
                      post({'type':'stage_complete','period':period,'taskId':t['id'],'stage':first,'doneBy':'Teams integration test'})
                      post({'type':'stage_undo','period':period,'taskId':t['id'],'stage':first})
                      print(f"Test handoff sent to configured Teams recipient: {next_owner}")
                      print(f"Test item: {t.get('name','Task')}")
                      print('Dashboard action was undone immediately after the push.')
                      break
              else:
                  print('Teams endpoint is connected, but no untouched task/deliverable currently has an eligible next-step Teams recipient.')
                  print('Add Teams email / UPN values in Settings > Team Management, then the next real handoff will push automatically.')
