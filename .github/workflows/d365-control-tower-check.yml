name: D365 Control Tower Check

on:
  push:
    branches: [main]
    paths:
      - 'd365-control-tower/**'
      - '.github/workflows/d365-control-tower-check.yml'
  pull_request:
    paths:
      - 'd365-control-tower/**'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: d365-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sync.js
          node --check views.js
          node --check editors.js
          node --check v2-model.js
          node --check v2-views-work.js
          node --check v2-views-gov.js
          node --check v2-editors-work.js
          node --check v2-editors-gov.js
          node --check v2-bind.js
          node --check v2-boot.js
      - name: Validate baseline JSON
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['data/framework.json','data/processes.json','data/registers.json','data/tasks.json','data/milestones.json','data/flows/manifest.json','data/sync.json'];
          for(const f of files) JSON.parse(fs.readFileSync(f,'utf8'));
          const manifest=JSON.parse(fs.readFileSync('data/flows/manifest.json','utf8'));
          for(const f of [...new Set(Object.values(manifest).flat())]) JSON.parse(fs.readFileSync(f,'utf8'));
          console.log('D365 baseline JSON valid');
          NODE
