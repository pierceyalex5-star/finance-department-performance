<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Work</title><style>
body{margin:0;background:#f5f6f8;color:#171a20;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 32px));background:white;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.08)}h1{margin:0 0 8px;font-size:28px}p{color:#6b7280;margin:0 0 20px;line-height:1.5}input{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:12px;padding:12px;margin-bottom:10px;font:inherit}button{width:100%;border:0;border-radius:12px;padding:12px;background:#111827;color:#fff;font:inherit;cursor:pointer}.err{color:#b91c1c;font-size:13px;margin-top:10px}</style></head><body><div class="card"><h1>My Work</h1><p>Your conversational task and project memory.</p><form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="Password" autofocus><button>Open My Work</button></form><div class="err" id="e"></div></div><script>f.onsubmit=async x=>{x.preventDefault();e.textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p.value})});if(r.ok)location.href='/';else e.textContent=(await r.json()).error||'Login failed';}</script></body></html>
