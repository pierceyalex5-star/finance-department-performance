name: Patch correction amount methodology

on:
  push:
    branches: [main]
    paths:
      - 'patch_correction_amounts.py'
      - 'patch_correction_one_side.py'
      - 'update_correction_seed_one_side.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch one-side correction methodology
        run: |
          python patch_correction_one_side.py
          python update_correction_seed_one_side.py
      - name: Validate
        run: |
          grep -q 'One debit/credit side per correction JE' index.html
          grep -q 'correctionGrossAmount' journal-analytics.js
          grep -q 'methodologyVersion":3' journal-analytics-seed.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html journal-analytics.js journal-analytics-seed.json
          git diff --cached --quiet || git commit -m "Use one side per correction JE and avoid double counting"
          git push
