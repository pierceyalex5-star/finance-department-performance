name: Apply Reliable Teams Push

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-teams-reliable.py'
      - '.github/workflows/apply-teams-reliable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Worker Teams handoff
        run: python scripts/patch-teams-reliable.py
      - name: Validate Worker JavaScript
        run: node --check cloudflare-worker/src/index.js
      - name: Commit generated Worker change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Await and verify Teams webhook handoffs"
          git push
