name: Debug Energir Natural Gas Price History
on:
  push:
    paths:
      - '.github/workflows/debug-statcan-ng.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install workbook reader
        run: python3 -m pip install --quiet openpyxl
      - name: Inspect Energir 5-year price workbook
        run: |
          python3 - <<'PY'
          import io, urllib.request
          from openpyxl import load_workbook
          u='https://energir.com/files/energir_common/Evolution_prix_en.xlsx'
          b=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'fastener-intelligence/1.0'}),timeout=45).read()
          wb=load_workbook(io.BytesIO(b),data_only=True,read_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
            print('SHEET',ws.title,ws.max_row,ws.max_column)
            for row in ws.iter_rows(min_row=1,max_row=min(ws.max_row,35),values_only=True):
              print('ROW',repr(row[:10]))
          PY
