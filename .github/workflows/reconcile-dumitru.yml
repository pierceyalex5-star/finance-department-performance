name: Reconcile Dumitru tasks
on:
  push:
    branches: [main]
    paths:
      - 'reconcile_dumitru_tasks.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python reconcile_dumitru_tasks.py
      - name: Commit reconciled state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json dumitru_reconcile_report.json
          git diff --cached --quiet || git commit -m "Reconcile Dumitru tasks without duplicating deliverables"
          git push
