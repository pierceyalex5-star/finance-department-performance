name: Integrate Finance SOP standard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-sop-standard.yml'
      - 'integrate_sop_standard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python integrate_sop_standard.py
      - name: Validate
        run: |
          grep -q 'fct-sop-standard-inline' index.html
          grep -q 'openFinanceSOPTemplate' index.html
      - name: Commit dashboard SOP integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate Finance SOP standard into dashboard"
          git push
