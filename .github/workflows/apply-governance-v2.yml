name: Apply Finance Control Tower governance v2

on:
  push:
    branches: [main]
    paths:
      - 'apply_governance_v2.py'
      - '.github/workflows/apply-governance-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply dashboard and Worker patch
        run: python apply_governance_v2.py
      - name: Validate JavaScript
        run: node --check cloudflare-worker/src/index.js
      - name: Commit code changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cloudflare-worker/src/index.js
          git diff --cached --quiet || git commit -m 'Update Finance Control Tower governance'
          git push
