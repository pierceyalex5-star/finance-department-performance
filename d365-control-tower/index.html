<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IFAST D365 Transformation Control Tower</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="enhancements.css" />
  <link rel="stylesheet" href="v2.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">D365</div><div><strong>IFAST D365 Transformation Control Tower</strong><span id="dataMode">GitHub shared · loading</span></div></div>
    <div class="top-actions"><button class="ghost" id="snapshotBtn">GitHub sync</button><button class="ghost" id="exportBtn">Export data</button><label class="ghost file-btn">Import data<input type="file" id="importFile" accept="application/json" hidden></label><button class="primary" id="refreshBtn">Refresh deployed</button></div>
  </header>
  <nav class="main-nav" id="mainNav">
    <button data-view="cockpit" class="active">Cockpit</button>
    <button data-view="streams">Value Streams</button>
    <button data-view="people">People</button>
    <button data-view="execution">Execution</button>
    <button data-view="governance">Governance</button>
    <button data-view="architecture">Data & Solution</button>
    <button data-view="steering">Steering Committee</button>
    <button data-view="roadmap">Roadmap</button>
  </nav>
  <main id="app"></main>
  <template id="modalTemplate"><div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3></h3><button class="icon-btn close-modal">×</button></div><div class="modal-body"></div><div class="modal-actions"></div></div></div></template>
  <script src="app.js"></script>
  <script src="sync.js"></script>
  <script src="views.js"></script>
  <script src="editors.js"></script>
  <script src="v2-model.js"></script>
  <script src="v2-views-work.js"></script>
  <script src="v2-views-gov.js"></script>
  <script src="v2-editors-work.js"></script>
  <script src="v2-editors-gov.js"></script>
  <script src="v2-executive.js"></script>
  <script src="v2-bind.js"></script>
  <script src="v2-boot.js"></script>
</body>
</html>
