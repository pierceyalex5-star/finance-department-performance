name: Deploy Cloudflare Live API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/cloudflare-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve deployment credentials
        shell: bash
        working-directory: .
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFARE_API_TOKEN || vars.CLOUDFARE_API_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CLOUDFLARE_TOKEN || vars.CLOUDFLARE_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CLOUDFARE_ACCOUNT_ID || vars.CLOUDFARE_ACCOUNT_ID }}
          ACCOUNT_3: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          ACCOUNT_4: ${{ secrets.CLOUDFLARE_ACCOUNTID || vars.CLOUDFLARE_ACCOUNTID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          token="$TOKEN_1"; [ -n "$token" ] || token="$TOKEN_2"; [ -n "$token" ] || token="$TOKEN_3"; [ -n "$token" ] || token="$TOKEN_4"
          account="$ACCOUNT_1"; [ -n "$account" ] || account="$ACCOUNT_2"; [ -n "$account" ] || account="$ACCOUNT_3"; [ -n "$account" ] || account="$ACCOUNT_4"
          test -n "$token" || { echo 'No recognized Cloudflare API token secret/variable name was found.'; exit 1; }
          test -n "$account" || { echo 'No recognized Cloudflare account ID secret/variable name was found.'; exit 1; }
          test -n "$DATABASE_URL" || { echo 'Missing DATABASE_URL'; exit 1; }
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo 'Cloudflare and Neon deployment credentials resolved.'
      - name: Install dependencies
        run: npm install
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Configure Neon database secret
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
