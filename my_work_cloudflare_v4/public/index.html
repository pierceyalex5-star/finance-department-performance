<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Work</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#171a20;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--blue:#1d4ed8;--red:#b91c1c;--amber:#a16207;--green:#166534;--purple:#6d28d9;--shadow:0 12px 38px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,textarea,input,select{font:inherit}.app{display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:16px;max-width:1550px;margin:auto;padding:18px;min-height:100vh}.chat,.workspace{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.chat{display:flex;flex-direction:column;min-height:calc(100vh - 36px);overflow:hidden}.head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h1{font-size:19px;margin:0}.head p{font-size:12px;color:var(--muted);margin:4px 0 0}.logout{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;color:var(--muted);cursor:pointer}.msgs{padding:22px;overflow:auto;flex:1;background:linear-gradient(#fff,#fcfcfd)}.msg{display:flex;margin-bottom:14px}.msg.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.46;font-size:14px}.user .bubble{background:#111827;color:#fff;border-bottom-right-radius:5px}.assistant .bubble{background:#f3f4f6;border-bottom-left-radius:5px}.composer{border-top:1px solid var(--line);padding:14px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px}textarea{min-height:72px;max-height:150px;resize:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafafa;outline:none}textarea:focus{background:#fff;border-color:#9ca3af}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer}.primary{background:#111827;color:#fff;border-color:#111827}.mic{font-size:20px;width:46px}.mic.on{border-color:#fca5a5;outline:3px solid #fee2e2}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;color:#4b5563;font-size:11px;cursor:pointer}.typing{color:var(--muted);font-size:12px;padding:4px 0 10px;display:none}
.workspace{padding:14px;overflow:auto;max-height:calc(100vh - 36px)}.workspace-head{position:sticky;top:-14px;background:#fff;z-index:6;padding:14px 0 10px}.workspace-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.workspace-title b{font-size:15px}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#fff;color:#4b5563;border-radius:999px;padding:7px 10px;font-size:11px;white-space:nowrap;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}.panel{display:none}.panel.active{display:block}h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 10px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.metric{border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}.metric .v{font-size:22px;font-weight:750}.metric .l{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section{margin-top:16px}.task{border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px;background:#fff}.task .top{display:flex;gap:8px;align-items:flex-start}.task input[type=checkbox]{width:17px;height:17px;margin-top:2px;flex:0 0 auto}.title{font-weight:650;font-size:13px;line-height:1.35}.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.tag{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:2px 6px;color:var(--muted)}.tag.red{color:var(--red);border-color:#fecaca}.tag.blue{color:var(--blue);border-color:#bfdbfe}.tag.amber{color:var(--amber);border-color:#fde68a}.tag.green{color:var(--green);border-color:#bbf7d0}.tag.purple{color:var(--purple);border-color:#ddd6fe}.project{border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:7px}.project b{font-size:13px}.project .sub{font-size:11px;color:var(--muted);margin-top:3px}.note{padding:9px 0;border-top:1px solid var(--line);font-size:12px}.note:first-child{border-top:0}.note b{display:block}.note span{color:var(--muted);font-size:11px}.searchbar{display:flex;gap:7px;margin:8px 0 12px}.searchbar input,.searchbar select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:12px}.searchbar select{max-width:125px}.countline{font-size:11px;color:var(--muted);margin:4px 0 10px}
.matrix-help{font-size:11px;color:var(--muted);margin:-2px 0 10px}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dropzone{border:1px dashed #cbd5e1;border-radius:14px;padding:9px;min-height:145px;background:#fafafa;transition:.15s}.dropzone.hot{outline:3px solid #dbeafe;border-color:#60a5fa;background:#eff6ff}.dropzone h4{font-size:12px;margin:0 0 2px}.dropzone .hint{font-size:10px;color:var(--muted);margin-bottom:8px}.matrix-task{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:7px;box-shadow:0 2px 8px rgba(15,23,42,.04)}.matrix-task.dragging{opacity:.55}.matrix-task .matrix-row{display:flex;gap:7px;align-items:flex-start}.grab{border:0;background:transparent;padding:0 2px;color:#9ca3af;cursor:grab;font-size:16px;line-height:1;touch-action:none;user-select:none}.matrix-task .mtitle{font-size:11px;font-weight:650;line-height:1.35;flex:1}.matrix-task .mmeta{font-size:9px;color:var(--muted);margin-top:4px}.matrix-task select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:5px;background:#fff;color:#4b5563;font-size:10px}.unsorted{margin-top:10px}.unsorted.dropzone{min-height:90px}
.people{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.person{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}.person.active{background:#111827;color:#fff;border-color:#111827}.person-summary{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#fafafa}.person-summary b{font-size:14px}.person-summary div{font-size:11px;color:var(--muted);margin-top:3px}.empty{font-size:12px;color:var(--muted);padding:12px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 12px;border-radius:10px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
@media(max-width:1120px){.app{grid-template-columns:minmax(0,1fr) 410px}.metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:10px;gap:10px}.chat{min-height:68vh}.workspace{max-height:none}.bubble{max-width:92%}.workspace-head{top:-14px}.metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.head{padding:14px}.msgs{padding:14px}.composer{padding:10px}.row{grid-template-columns:1fr auto}.mic{display:none}.primary{grid-column:2}.quick{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.quick button{white-space:nowrap}.workspace{padding:10px;border-radius:16px}.workspace-head{top:-10px;padding-top:10px}.metrics{grid-template-columns:repeat(2,1fr)}.matrix{grid-template-columns:1fr}.dropzone{min-height:105px}.bubble{font-size:13px}.searchbar{flex-direction:column}.searchbar select{max-width:none}}
</style>
</head>
<body>
<div class="app">
  <section class="chat">
    <div class="head"><div><h1>My Work</h1><p>Talk normally. I’ll organize the work.</p></div><button class="logout" id="logout">Log out</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="composer"><div class="typing" id="typing">Thinking and updating your workspace…</div><div class="row"><textarea id="box" placeholder="Tell me what’s on your mind…"></textarea><button class="btn mic" id="mic">🎤</button><button class="btn primary" id="send">Send</button></div><div class="quick"><button data-q="What should I focus on today?">What should I focus on?</button><button data-q="What am I waiting on?">Waiting on?</button><button data-q="What is overdue?">Overdue?</button><button data-q="What did we decide recently?">Recent decisions</button><button data-q="Show me my current projects and next actions.">Projects</button></div></div>
  </section>
  <aside class="workspace">
    <div class="workspace-head"><div class="workspace-title"><b>Workspace</b><span id="sync" class="tag green">Live</span></div><div class="tabs" id="tabs"><button class="tab active" data-tab="focus">Focus</button><button class="tab" data-tab="tasks">Tasks</button><button class="tab" data-tab="matrix">Eisenhower</button><button class="tab" data-tab="with">With</button><button class="tab" data-tab="projects">Projects</button><button class="tab" data-tab="notes">Notes</button></div></div>
    <div class="panel active" id="panel-focus"><div class="metrics"><div class="metric"><div class="v" id="openN">0</div><div class="l">Open tasks</div></div><div class="metric"><div class="v" id="today">0</div><div class="l">Due today</div></div><div class="metric"><div class="v" id="overdue">0</div><div class="l">Overdue</div></div><div class="metric"><div class="v" id="waiting">0</div><div class="l">Waiting</div></div><div class="metric"><div class="v" id="projectsN">0</div><div class="l">Projects</div></div></div><div class="section"><h3>Priority work</h3><div id="priorityTasks"></div></div></div>
    <div class="panel" id="panel-tasks"><div class="searchbar"><input id="taskSearch" placeholder="Search tasks, projects or people"><select id="taskStatus"><option value="open">Open</option><option value="waiting">Waiting</option><option value="all">All</option><option value="done">Done</option></select></div><div class="countline" id="taskCount"></div><div id="allTasks"></div></div>
    <div class="panel" id="panel-matrix"><div class="matrix-help">Drag tasks between quadrants. On phone, drag using the ☰ handle or use the Move menu.</div><div class="matrix" id="matrix"></div><div class="dropzone unsorted" data-q="" ondragover="allowDrop(event)" ondrop="dropTask(event,'')"><h4>Unsorted</h4><div class="hint">Tasks not yet classified</div><div id="q-unsorted"></div></div></div>
    <div class="panel" id="panel-with"><div class="people" id="people"></div><div id="withContent"></div></div>
    <div class="panel" id="panel-projects"><div id="projects"></div></div>
    <div class="panel" id="panel-notes"><div id="notes"></div></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let st=null,currentTab='focus',currentPerson='',dragId=null,touchDrag=null,toastTimer=null;
const qLabels={do:'Do now',schedule:'Schedule',delegate:'Delegate',later:'Later'};
function fmt(d){if(!d)return'No date';return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function dueClass(t){if(!t.due_at)return'';return new Date(t.due_at)<new Date()&&!['done','cancelled'].includes(t.status)?'red':''}
function taskPeople(t){return [...new Set([...(t.with_people||[]),...(t.waiting_on?[t.waiting_on]:[])])].filter(Boolean)}
function tagsForTask(t){let out='';if(t.project_name)out+=`<span class="tag blue">${esc(t.project_name)}</span>`;if(t.due_at)out+=`<span class="tag ${dueClass(t)}">${fmt(t.due_at)}</span>`;if(t.status==='waiting')out+=`<span class="tag amber">Waiting${t.waiting_on?' · '+esc(t.waiting_on):''}</span>`;if(t.eisenhower_quadrant)out+=`<span class="tag purple">${qLabels[t.eisenhower_quadrant]}</span>`;for(const p of taskPeople(t))out+=`<span class="tag green">With · ${esc(p)}</span>`;return out}
function taskCard(t,complete=true){return `<div class="task"><div class="top">${complete&&!['done','cancelled'].includes(t.status)?`<input type="checkbox" onchange="done('${t.id}')">`:''}<div><div class="title">${esc(t.title)}</div><div class="meta">${tagsForTask(t)}</div></div></div></div>`}
function projectCard(p){const people=(p.with_people||[]).map(x=>`<span class="tag green">With · ${esc(x)}</span>`).join('');return `<div class="project"><b>${esc(p.name)}</b><div class="sub">${p.open_tasks} open task${p.open_tasks===1?'':'s'}</div>${people?`<div class="meta">${people}</div>`:''}</div>`}
function matrixCard(t){return `<div class="matrix-task" id="mt-${t.id}" draggable="true" ondragstart="dragTask(event,'${t.id}')" ondragend="endDrag()"><div class="matrix-row"><button class="grab" title="Drag task" onpointerdown="touchStart(event,'${t.id}')">☰</button><div class="mtitle">${esc(t.title)}<div class="mmeta">${t.project_name?esc(t.project_name)+' · ':''}${t.due_at?fmt(t.due_at):'No date'}${taskPeople(t).length?' · '+esc(taskPeople(t).join(', ')):''}</div></div></div><select onchange="moveQuadrant('${t.id}',this.value);this.value=''"><option value="">Move…</option><option value="do">Do now</option><option value="schedule">Schedule</option><option value="delegate">Delegate</option><option value="later">Later</option><option value="__unsorted">Unsorted</option></select></div>`}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
async function api(url,opts={}){const r=await fetch(url,opts);const ct=(r.headers.get('content-type')||'').toLowerCase();if(r.status===401){location.href='/login.html';throw new Error('Session expired. Please log in again.')}if(!ct.includes('application/json')){const raw=await r.text();if(raw.trim().startsWith('<')){location.href='/login.html';throw new Error('Session expired or the server returned a page instead of data.')}throw new Error(`Server returned ${r.status}: ${raw.slice(0,160)}`)}const x=await r.json();if(!r.ok)throw new Error(x.error||`Request failed (${r.status})`);return x}
function render(){if(!st)return;openN.textContent=st.metrics.open||0;today.textContent=st.metrics.today;overdue.textContent=st.metrics.overdue;waiting.textContent=st.metrics.waiting;projectsN.textContent=st.metrics.projects;msgs.innerHTML=st.messages.map(m=>`<div class="msg ${m.role}"><div class="bubble">${esc(m.content)}</div></div>`).join('');msgs.scrollTop=msgs.scrollHeight;renderFocus();renderTasks();renderMatrix();renderWith();renderProjects();renderNotes()}
function openTasks(){return st.tasks.filter(t=>!['done','cancelled'].includes(t.status))}
function renderFocus(){const open=openTasks();const rank=t=>{let n=0;if(t.eisenhower_quadrant==='do')n+=100;if(t.priority==='high')n+=35;if(t.status==='waiting')n+=10;if(t.due_at){const d=new Date(t.due_at)-new Date();if(d<0)n+=80;else if(d<86400000)n+=50;else if(d<259200000)n+=25}return n};const sorted=[...open].sort((a,b)=>rank(b)-rank(a));priorityTasks.innerHTML=sorted.slice(0,10).map(t=>taskCard(t)).join('')||'<div class="empty">Nothing open.</div>'}
function renderTasks(){if(!st)return;const q=(taskSearch?.value||'').toLowerCase(),status=taskStatus?.value||'open';let rows=st.tasks.filter(t=>status==='all'||(status==='open'?!['done','cancelled'].includes(t.status):t.status===status));if(q)rows=rows.filter(t=>[t.title,t.details,t.project_name,t.waiting_on,...taskPeople(t)].some(x=>String(x||'').toLowerCase().includes(q)));taskCount.textContent=`${rows.length} task${rows.length===1?'':'s'}`;allTasks.innerHTML=rows.map(t=>taskCard(t)).join('')||'<div class="empty">No matching tasks.</div>'}
function renderMatrix(){const open=openTasks();const defs=[['do','Do now','Urgent + important'],['schedule','Schedule','Important, not urgent'],['delegate','Delegate','Urgent, less important'],['later','Later / eliminate','Not urgent, not important']];matrix.innerHTML=defs.map(([q,title,hint])=>`<div class="dropzone" data-q="${q}" ondragover="allowDrop(event)" ondragleave="this.classList.remove('hot')" ondrop="dropTask(event,'${q}')"><h4>${title}</h4><div class="hint">${hint}</div><div>${open.filter(t=>t.eisenhower_quadrant===q).map(matrixCard).join('')||'<div class="empty">Drop tasks here</div>'}</div></div>`).join('');$('q-unsorted').innerHTML=open.filter(t=>!t.eisenhower_quadrant).map(matrixCard).join('')||'<div class="empty">Everything is classified.</div>'}
function renderWith(){const ps=st.people||[];if(!currentPerson&&ps.length)currentPerson=ps[0];people.innerHTML=ps.map(p=>`<button class="person ${p===currentPerson?'active':''}" onclick="choosePerson('${esc(p).replace(/'/g,'&#039;')}')">${esc(p)}</button>`).join('')||'<div class="empty">No people have been linked yet. Tell me “this task is with Josiane” or “the D365 project is with Akram.”</div>';if(!currentPerson){withContent.innerHTML='';return}const tasks=st.tasks.filter(t=>taskPeople(t).some(p=>p.toLowerCase()===currentPerson.toLowerCase()));const projects=st.projects.filter(p=>(p.with_people||[]).some(x=>String(x).toLowerCase()===currentPerson.toLowerCase()));withContent.innerHTML=`<div class="person-summary"><b>${esc(currentPerson)}</b><div>${tasks.filter(t=>!['done','cancelled'].includes(t.status)).length} open tasks · ${projects.length} projects</div></div><h3>Tasks</h3>${tasks.map(t=>taskCard(t)).join('')||'<div class="empty">No tasks.</div>'}<h3>Projects</h3>${projects.map(projectCard).join('')||'<div class="empty">No projects.</div>'}`}
function renderProjects(){projects.innerHTML=st.projects.map(projectCard).join('')||'<div class="empty">No projects yet.</div>'}
function renderNotes(){notes.innerHTML=st.notes.map(n=>`<div class="note"><b>${esc(n.title||n.body)}</b><span>${esc(n.kind)}${n.project_name?' · '+esc(n.project_name):''}</span></div>`).join('')||'<div class="empty">No notes yet.</div>'}
async function load(){sync.textContent='Syncing…';sync.className='tag amber';try{st=await api('/api/state');render();sync.textContent='Live';sync.className='tag green'}catch(e){sync.textContent='Error';sync.className='tag red';if(!String(e.message).includes('Session expired'))showToast(e.message)}}
async function ask(text){text=(text||'').trim();if(!text)return;box.value='';if(!st)await load();st.messages.push({role:'user',content:text});render();typing.style.display='block';send.disabled=true;try{await api('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text})});await load()}catch(e){if(st){st.messages.push({role:'assistant',content:'Error: '+e.message});render()}}finally{typing.style.display='none';send.disabled=false;box.focus()}}
async function done(id){try{await api(`/api/tasks/${id}/complete`,{method:'POST'});await load()}catch(e){showToast(e.message)}}
async function moveQuadrant(id,q){if(q==='__unsorted')q='';try{await api(`/api/tasks/${id}/matrix`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({quadrant:q||null})});showToast(q?`Moved to ${qLabels[q]}`:'Moved to Unsorted');await load()}catch(e){showToast(e.message)}}
function dragTask(e,id){dragId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);setTimeout(()=>$('mt-'+id)?.classList.add('dragging'),0)}function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('hot')}function dropTask(e,q){e.preventDefault();e.currentTarget.classList.remove('hot');const id=e.dataTransfer.getData('text/plain')||dragId;if(id)moveQuadrant(id,q)}function endDrag(){document.querySelectorAll('.dropzone').forEach(x=>x.classList.remove('hot'));document.querySelectorAll('.matrix-task').forEach(x=>x.classList.remove('dragging'));dragId=null}
function touchStart(e,id){if(e.pointerType==='mouse')return;e.preventDefault();touchDrag={id,pointerId:e.pointerId};e.currentTarget.setPointerCapture?.(e.pointerId);$('mt-'+id)?.classList.add('dragging');e.currentTarget.addEventListener('pointermove',touchMove);e.currentTarget.addEventListener('pointerup',touchEnd,{once:true});e.currentTarget.addEventListener('pointercancel',touchEnd,{once:true})}function touchMove(e){if(!touchDrag)return;document.querySelectorAll('.dropzone').forEach(x=>x.classList.remove('hot'));const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.dropzone');if(z)z.classList.add('hot')}function touchEnd(e){if(!touchDrag)return;const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.dropzone');const id=touchDrag.id;touchDrag=null;document.querySelectorAll('.dropzone').forEach(x=>x.classList.remove('hot'));$('mt-'+id)?.classList.remove('dragging');if(z)moveQuadrant(id,z.dataset.q||'')}
function choosePerson(p){currentPerson=p;renderWith()}
function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));if(tab==='matrix')renderMatrix();if(tab==='with')renderWith()}
$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)};send.onclick=()=>ask(box.value);box.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(box.value)}};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));taskSearch.oninput=renderTasks;taskStatus.onchange=renderTasks;logout.onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch{}location.href='/login.html'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='en-CA';r.onresult=e=>box.value+=(box.value?' ':'')+e.results[0][0].transcript;r.onend=()=>{mic.classList.remove('on');mic.textContent='🎤'};mic.onclick=()=>{mic.classList.add('on');mic.textContent='●';r.start()}}else mic.onclick=()=>alert('Use your device dictation in this browser.');
load();
</script>
</body>
</html>
