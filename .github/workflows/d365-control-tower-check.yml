name: D365 Control Tower Check

on:
  push:
    branches: [main]
    paths:
      - 'd365-control-tower/**'
      - '.github/workflows/d365-control-tower-check.yml'
  pull_request:
    paths:
      - 'd365-control-tower/**'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: d365-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every deployed JavaScript module
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m=>m[1].split('?')[0]);
          const styles=[...html.matchAll(/<link[^>]+href="([^"]+\.css[^\"]*)"/g)].map(m=>m[1].split('?')[0]);
          for(const f of [...scripts,...styles]){
            if(!fs.existsSync(f))throw new Error(`Referenced asset missing: ${f}`);
          }
          for(const f of scripts){
            console.log(`node --check ${f}`);
            cp.execFileSync(process.execPath,['--check',f],{stdio:'inherit'});
          }
          console.log(`Validated ${scripts.length} deployed JavaScript modules and ${styles.length} stylesheets.`);
          NODE
      - name: Validate V18 AI Copilot compatibility source
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let code=fs.readFileSync('v18-ai-copilot.js','utf8');
          const broken="try{if(typeof currentMilestone==='function'){const m=currentMilestone();if(m)return {m,readiness:typeof gateReadiness==='function'?gateReadiness(m):null,status:typeof gateStatus==='function'?gateStatus(m):m.status}}catch(_){ }";
          const fixed="try{if(typeof currentMilestone==='function'){const m=currentMilestone();if(m)return {m,readiness:typeof gateReadiness==='function'?gateReadiness(m):null,status:typeof gateStatus==='function'?gateStatus(m):m.status}}}catch(_){ }";
          if(code.includes(broken))code=code.replace(broken,fixed);
          if(!code.includes(fixed))throw new Error('V18 compatibility patch target not found');
          new Function(code);
          console.log('V18 AI Copilot runtime source compiles after compatibility patch.');
          NODE
      - name: Validate baseline JSON
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['data/framework.json','data/processes.json','data/registers.json','data/tasks.json','data/milestones.json','data/planning.json','data/flows/manifest.json','data/sync.json'];
          for(const f of files) JSON.parse(fs.readFileSync(f,'utf8'));
          const manifest=JSON.parse(fs.readFileSync('data/flows/manifest.json','utf8'));
          for(const f of [...new Set(Object.values(manifest).flat())]) JSON.parse(fs.readFileSync(f,'utf8'));
          console.log('D365 baseline JSON valid');
          NODE
