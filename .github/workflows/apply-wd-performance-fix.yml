name: Apply WD and performance fix

on:
  push:
    branches: [main]
    paths:
      - 'apply_wd_performance_fix.py'
      - '.github/workflows/apply-wd-performance-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python apply_wd_performance_fix.py
      - name: Validate main inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          main=max((b for b in blocks if 'function businessDay' in b), key=len)
          pathlib.Path('/tmp/dashboard-main.js').write_text(main,encoding='utf-8')
          PY
          node --check /tmp/dashboard-main.js
      - name: Install Neon dependency
        run: npm install @neondatabase/serverless
      - name: Seed shared state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import { neon } from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL);
          const state=JSON.parse(fs.readFileSync('state.json','utf8'));
          await sql`UPDATE dashboard_state SET state=${JSON.stringify(state)}::jsonb, updated_at=now() WHERE id=1`;
          console.log('Neon seeded to version',state.version);
          NODE
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html state.json
          git diff --cached --quiet || git commit -m 'Remove WD0 and optimize dashboard rendering'
          git push
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html manifest.json sw.js config.js auto-sync.js sop-upload.js state.json journal-analytics-seed.json _site/
          if [ -d sops ]; then cp -R sops _site/; fi
          if [ -d templates ]; then cp -R templates _site/; fi
          if [ -d d365-control-tower ]; then cp -R d365-control-tower _site/; fi
          if [ -d fastener-intelligence ]; then cp -R fastener-intelligence _site/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
