name: Apply Backup Timestamp and Scoring Enhancements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/add-backups-timestamps-auto-score.py'
      - '.github/workflows/apply-backup-timestamps-score.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dashboard changes
        run: python scripts/add-backups-timestamps-auto-score.py
      - name: Commit generated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cloudflare-worker/src/index.js
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add backup files timestamps and automatic scoring"
            git push
          fi
